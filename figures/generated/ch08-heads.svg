<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Heads are a view of projected coordinates</title><desc id="desc">Locate every head coordinate in the same four-element activation payload. Canonical Q [2,2], element strides [2,1]; head h starts at 2h. F32 byte displacement is four times the element offset; no copy is implied.</desc>
