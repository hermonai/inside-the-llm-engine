<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Follow the owner before freeing the byte</title><desc id="desc">Separate logical sequence state, shared physical storage and asynchronous device lifetimes. Solid = reference or data access; dashed = control / lifecycle signal. State ownership shown here is a design contract, not a Rust type declaration. Cancellation requests retirement; completion and refcounts determine safe reclamation.</desc>
