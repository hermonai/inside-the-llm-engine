<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Logical tokens are not physical memory</title><desc id="desc">Distinguish valid state, reserved capacity and shared allocation ownership before adding bytes. Formula assumes uniform dense K,V tensors; b is stored bytes per element. The shared-block fixture has 2 tokens per block; each block contains 64 bytes. Category widths are not proportions. No device capacity or performance is implied.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-INDUSTRIAL-MEMORY-001  /  EDUCATIONAL / REFERENCE</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Logical tokens are not physical memory</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Distinguish valid state, reserved capacity and shared allocation ownership before adding</text>
<text x="40" y="163" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">bytes.</text>
<text x="45" y="204" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">01  Count disjoint physical allocations, once, on a named device</text>
<rect x="45" y="225" width="910" height="62" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="59" y="254" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start"></text>
<text x="59" y="262" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Weights</text>
<line x1="200" y1="225" x2="200" y2="287" stroke="#152b3c" stroke-width="1.5"/>
<text x="214" y="262" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">KV pages</text>
<line x1="355" y1="225" x2="355" y2="287" stroke="#152b3c" stroke-width="1.5"/>
<text x="369" y="262" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Activations</text>
<line x1="510" y1="225" x2="510" y2="287" stroke="#152b3c" stroke-width="1.5"/>
<text x="524" y="262" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Workspace</text>
<line x1="665" y1="225" x2="665" y2="287" stroke="#152b3c" stroke-width="1.5"/>
<text x="679" y="262" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Graph state</text>
<line x1="810" y1="225" x2="810" y2="287" stroke="#152b3c" stroke-width="1.5"/>
<text x="824" y="262" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Runtime</text>
<text x="45" y="314" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Schematic categories, not a measured stacked bar. Allocator slack is additional.</text>
<rect x="45" y="345" width="438" height="159" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="59" y="374" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">02  Uniform dense-attention example</text>
<text x="59" y="399" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">KV bytes = 2 × L × T × Hkv × dh × b</text>
<text x="59" y="424" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">L=2, T=4, Hkv=1, dh=2, b=4</text>
<text x="59" y="449" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">One sequence: 128 valid KV bytes</text>
<text x="59" y="474" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">No padding or metadata in this formula</text>
<rect x="507" y="345" width="448" height="159" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="521" y="374" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">03  Two sequences, three physical blocks</text>
<text x="539" y="405" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">A</text>
<text x="916" y="405" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">B</text>
<rect x="687" y="387" width="90" height="42" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="701" y="416" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">S</text>
<rect x="563" y="436" width="90" height="42" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="577" y="465" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">A tail</text>
<rect x="811" y="436" width="90" height="42" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="825" y="465" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">B tail</text>
<line x1="555" y1="401" x2="687" y2="407" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="687.00,407.00 677.81,410.94 678.20,402.25"/>
<line x1="909" y1="401" x2="777" y2="407" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="777.00,407.00 785.80,402.25 786.19,410.94"/>
<line x1="546" y1="411" x2="598" y2="436" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="598.00,436.00 588.00,436.02 591.77,428.18"/>
<line x1="923" y1="411" x2="866" y2="436" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="866.00,436.00 872.50,428.40 875.99,436.37"/>
<text x="732" y="461" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">shared S</text>
<text x="526" y="495" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">3 × 64 B = 192 B; logical sum = 256 B</text>
<text x="45" y="546" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Reserved page capacity ≥ valid KV bytes; page tables and refcounts also cost memory.</text>
<text x="45" y="576" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">MLA, recurrent state, sliding windows and heterogeneous layers need other formulas.</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Formula assumes uniform dense K,V tensors; b is stored bytes per element.</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">The shared-block fixture has 2 tokens per block; each block contains 64 bytes.</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Category widths are not proportions. No device capacity or performance is implied.</text>
</svg>
