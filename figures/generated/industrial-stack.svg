<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Three systems cooperate to emit one token</title><desc id="desc">Model semantics defines the computation; the engine executes it; serving decides whose work runs. Reference architecture, not a claim that every engine uses this organization. Weights E[V,D] are parameters; X[T,D] and logits [V] are activations. KV is persistent state beside execution, not a mandatory serial stage.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-INDUSTRIAL-STACK-001  /  EDUCATIONAL / REFERENCE</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Three systems cooperate to emit one token</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Model semantics defines the computation; the engine executes it; serving decides whose</text>
<text x="40" y="163" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">work runs.</text>
<text x="45" y="202" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">SERVING SYSTEM</text>
<text x="355" y="202" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">MODEL SEMANTICS</text>
<text x="665" y="202" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">EXECUTION ENGINE</text>
<rect x="45" y="222" width="270" height="101" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="59" y="251" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Request + policy</text>
<text x="59" y="276" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Template, limits, identity</text>
<text x="59" y="301" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Queue / admission</text>
<rect x="355" y="222" width="270" height="101" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="369" y="251" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Typed model program</text>
<text x="369" y="276" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">IDs → E[V,D] lookup</text>
<text x="369" y="301" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">X[T,D] → decoder layers</text>
<rect x="665" y="222" width="290" height="101" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="679" y="251" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Executable plan</text>
<text x="679" y="276" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Graph / layout / kernels</text>
<text x="679" y="301" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">CPU or accelerator</text>
<line x1="315" y1="263" x2="355" y2="263" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="355.00,263.00 346.00,267.35 346.00,258.65"/>
<line x1="625" y1="263" x2="665" y2="263" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="665.00,263.00 656.00,267.35 656.00,258.65"/>
<text x="325" y="249" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="start">IDs</text>
<text x="629" y="249" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="start">ops</text>
<rect x="45" y="380" width="270" height="105" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="59" y="409" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Sample + stream</text>
<text x="59" y="434" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Constraints and RNG</text>
<text x="59" y="459" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Stop, cancel, or continue</text>
<rect x="355" y="380" width="270" height="105" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="369" y="409" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Output scores</text>
<text x="369" y="434" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Last hidden state [D]</text>
<text x="369" y="459" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">LM head → logits [V]</text>
<rect x="665" y="380" width="290" height="105" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="679" y="409" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Persistent KV state</text>
<text x="679" y="434" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Read prior K,V; write new</text>
<text x="679" y="459" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Logical IDs ≠ block IDs</text>
<line x1="672" y1="387" x2="948" y2="387" stroke="#152b3c" stroke-width="1.5"/>
<line x1="672" y1="478" x2="948" y2="478" stroke="#152b3c" stroke-width="1.5"/>
<line x1="810" y1="323" x2="810" y2="380" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="810.00,380.00 805.65,371.00 814.35,371.00"/>
<text x="824" y="352" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">read / write</text>
<line x1="788" y1="380" x2="788" y2="323" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="788.00,323.00 792.35,332.00 783.65,332.00"/>
<line x1="730" y1="323" x2="730" y2="350" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="730.00,350.00 725.65,341.00 734.35,341.00"/>
<line x1="730" y1="350" x2="490" y2="350" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="490.00,350.00 499.00,345.65 499.00,354.35"/>
<line x1="490" y1="350" x2="490" y2="380" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="490.00,380.00 485.65,371.00 494.35,371.00"/>
<text x="520" y="344" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">hidden activations</text>
<line x1="355" y1="429" x2="315" y2="429" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="315.00,429.00 324.00,424.65 324.00,433.35"/>
<text x="319" y="412" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">z</text>
<line x1="80" y1="380" x2="80" y2="323" stroke="#152b3c" stroke-width="2.5" stroke-dasharray="6 5"/>
<polygon fill="#152b3c" points="80.00,323.00 84.35,332.00 75.65,332.00"/>
<text x="94" y="354" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">next ID / next iteration</text>
<text x="45" y="524" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Optional: prefix reuse avoids work; speculation proposes work for verification.</text>
<text x="45" y="552" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Cross-cutting: correctness, resource limits, observability, security, distribution.</text>
<text x="45" y="580" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Solid = data / execution    Dashed = continuation control    Double rule = state</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Reference architecture, not a claim that every engine uses this organization.</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Weights E[V,D] are parameters; X[T,D] and logits [V] are activations.</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">KV is persistent state beside execution, not a mandatory serial stage.</text>
</svg>
