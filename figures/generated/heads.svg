<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Heads regroup values without moving them</title><desc id="desc">A canonical flat vector [4] becomes [2,2]; head coordinates map to the same four elements. D = 4, H = 2, Dₕ = 2; offset(h,j) = h × 2 + j; No arithmetic, allocation or transpose is implied by this view</desc>
