<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Four pairs become one scalar</title><desc id="desc">Match reduction index k, multiply each pair, then sum the four products. a [4] dot x [4] gives one scalar; F32 inputs and accumulator. Products [2,-2,-3,0]; increasing-k partial sums [2,0,-3,-3]. Empty dot returns zero; unequal lengths and non-vector ranks are errors.</desc>
