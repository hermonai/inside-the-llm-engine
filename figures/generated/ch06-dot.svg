<text x="84" y="512" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Reduce products in increasing k</text>
<text x="84" y="537" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">2 + (-2) + (-3) + 0 = -3; one scalar, not four outputs</text>
