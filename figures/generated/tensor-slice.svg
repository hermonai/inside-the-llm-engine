<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Four values can require six storage slots</title><desc id="desc">Selecting columns one and two preserves row stride three and moves the base to element one.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-TENSOR-SLICE-001  /  EDUCATIONAL MODEL</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Four values can require six storage slots</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Selecting columns one and two preserves row stride three and moves the base to element</text>
<text x="40" y="163" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">one.</text>
<text x="60" y="210" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">01  Original A</text>
<rect x="60" y="238" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">1</text>
<rect x="128" y="238" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="142" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">2</text>
<rect x="196" y="238" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="210" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">3</text>
<rect x="60" y="286" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="315" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">4</text>
<rect x="128" y="286" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="142" y="315" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">5</text>
<rect x="196" y="286" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="210" y="315" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">6</text>
<line x1="335" y1="283" x2="520" y2="283" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="520.00,283.00 511.00,287.35 511.00,278.65"/>
<text x="335" y="256" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">columns 1..3</text>
<text x="550" y="210" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">02  S = A[:,1:3]</text>
<rect x="550" y="238" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="564" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">2</text>
<rect x="618" y="238" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="632" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">3</text>
<rect x="550" y="286" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="564" y="315" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">5</text>
<rect x="618" y="286" width="68" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="632" y="315" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">6</text>
<text x="60" y="389" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">03  Keep full storage; base shifts to element 1</text>
<rect x="60" y="414" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="443" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">1</text>
<rect x="170" y="414" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="184" y="443" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">2</text>
<rect x="280" y="414" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="294" y="443" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">3</text>
<rect x="390" y="414" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="404" y="443" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">4</text>
<rect x="500" y="414" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="514" y="443" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">5</text>
<rect x="610" y="414" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="624" y="443" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">6</text>
<text x="81" y="492" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">skip</text>
<text x="191" y="492" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">read 1</text>
<text x="301" y="492" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">read 2</text>
<text x="411" y="492" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">skip</text>
<text x="521" y="492" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">read 4</text>
<text x="631" y="492" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">read 5</text>
<rect x="60" y="523" width="870" height="57" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="552" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">max offset 5 → minimum backing length 6; logical element count is only 4</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">S [2,2], strides [3,1], base 1; values [2,3,5,6]</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">offset(i,j) = 1 + 3i + j; reachable offsets [1,2,4,5]</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Four logical F32 values = 16 bytes; required backing length = 6 elements</text>
</svg>
