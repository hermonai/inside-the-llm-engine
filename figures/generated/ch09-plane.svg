<text x="558" y="245" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">Basis vectors determine the map</text>
<text x="558" y="279" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">(1,0) becomes (cos φ, sin φ)</text>
<text x="558" y="306" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">(0,1) becomes (−sin φ, cos φ)</text>
<rect x="540" y="381" width="405" height="176" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="554" y="410" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start"></text>
<text x="558" y="411" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">Position 1 / first plane</text>
<text x="558" y="445" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">φ = 1 radian, not 1 degree</text>
<text x="558" y="472" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">[1,2] becomes</text>
<text x="558" y="499" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">[-1.142640, 1.922076]</text>
<text x="558" y="526" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Squared length stays 5</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Positive angles rotate counterclockwise; coordinate axes are a and b.</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">For [1,2], squared norm is 5 before and after rotation, up to floating-point error.</text>
</svg>
