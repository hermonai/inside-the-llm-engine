<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Changing position is not changing the base</title><desc id="desc">Compare analytical phase slopes instead of promising unmeasured long-context quality. R = 4: standard theta = 100, interpolation p/4, and changed theta = 10000. Only the slower plane is plotted; first-plane frequency stays 1 under a base change.</desc>
