<text x="335" y="264" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">metadata only</text>
<text x="60" y="377" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">A[1,0] = 4</text>
<text x="730" y="314" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Aᵀ[0,1] = 4</text>
