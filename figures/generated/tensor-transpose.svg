<text x="60" y="550" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Transpose logical offsets: [0, 3, 1, 4, 2, 5]</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">A [2,3], strides [3,1] → Aᵀ [3,2], strides [1,3]</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Aᵀ[j,i] = A[i,j]; offset(j,i) = j + 3i</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">F32; immutable borrowed views; zero element copies</text>
