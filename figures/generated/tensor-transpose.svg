<text x="210" y="312" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">6</text>
<text x="560" y="208" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">02  Swap axes, preserve values</text>
