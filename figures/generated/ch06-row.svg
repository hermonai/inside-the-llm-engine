<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Watch one row accumulate</title><desc id="desc">Four ordered updates produce y[0] from row 0 of W and the shared x. W [3,4] times x [4] produces a fresh y [3]. The row-0 accumulator starts at zero and ends at -3. Read-only inputs; the output is stored after the reduction.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-CH06-GEMV-ONE-ROW  /  CANONICAL / CHAPTER 6</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Watch one row accumulate</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Four ordered updates produce y[0] from row 0 of W and the shared x.</text>
<text x="50" y="211" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Row 0: W[0,:] [1, -2, 3, 0]; x [2, 1, -1, 0.5]</text>
<rect x="60" y="244" width="875" height="61" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="273" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">k=0:  1 × 2 = 2     sum: 0 → 2</text>
<rect x="60" y="322" width="875" height="61" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="351" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">k=1:  -2 × 1 = -2     sum: 2 → 0</text>
<rect x="60" y="400" width="875" height="61" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="429" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">k=2:  3 × -1 = -3     sum: 0 → -3</text>
<rect x="60" y="478" width="875" height="61" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="507" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">k=3:  0 × 0.5 = 0     sum: -3 → -3</text>
<text x="60" y="590" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">After k=3, store y[0] = -3. This output is written once.</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">W [3,4] times x [4] produces a fresh y [3].</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">The row-0 accumulator starts at zero and ends at -3.</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Read-only inputs; the output is stored after the reduction.</text>
</svg>
