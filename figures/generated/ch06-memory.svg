<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">A multiplication begins with an address</title><desc id="desc">Connect logical W[1,2] to its flat element and byte displacement. Canonical W shape [3,4], element strides [4,1], base offset 0. offset(1,2)=6; byte displacement 24; loaded value -1. For general views use base + sum(index times stride), not iK+k.</desc>
