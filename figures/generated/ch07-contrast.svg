<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">RMS normalization is not mean centering</title><desc id="desc">Use a uniform vector to expose the operation that LayerNorm performs and RMSNorm omits. Uniform x=[4,4,4,4], positive epsilon; both gains 1, LayerNorm bias 0. Mixed-sign fixture output RMS is about 1.342 after learned gain, not unity.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-CH07-CONTRAST  /  CANONICAL / CHAPTER 7</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">RMS normalization is not mean centering</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Use a uniform vector to expose the operation that LayerNorm performs and RMSNorm omits.</text>
<rect x="50" y="210" width="430" height="166" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="64" y="239" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start"></text>
<text x="68" y="240" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">RMSNorm / no centering</text>
<text x="68" y="274" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">x = [4,4,4,4]; gain = [1,1,1,1]</text>
<text x="68" y="301" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">mean(x²) = 16</text>
<text x="68" y="328" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">yᵢ = 4 / √(16 + epsilon)</text>
<text x="68" y="355" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">≈ 1, but not exactly 1</text>
<rect x="515" y="210" width="430" height="166" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="529" y="239" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start"></text>
<text x="533" y="240" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">LayerNorm / center first</text>
<text x="533" y="274" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">same x; gain 1; bias 0</text>
<text x="533" y="301" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">mean(x) = 4</text>
<text x="533" y="328" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">x − mean(x) = [0,0,0,0]</text>
<text x="533" y="355" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">output = [0,0,0,0]</text>
<rect x="50" y="427" width="895" height="135" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="64" y="456" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start"></text>
<text x="68" y="457" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">Learned gain is not a second normalization</text>
<text x="68" y="491" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Our mixed-sign fixture uses gain [1,0.5,2,-1].</text>
<text x="68" y="518" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Its output RMS is about 1.342, not 1. Negative gain can flip a sign.</text>
<text x="68" y="545" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Neither operator is coordinate clipping; this comparison is not a speed benchmark.</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Uniform x=[4,4,4,4], positive epsilon; both gains 1, LayerNorm bias 0.</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Mixed-sign fixture output RMS is about 1.342 after learned gain, not unity.</text>
</svg>
