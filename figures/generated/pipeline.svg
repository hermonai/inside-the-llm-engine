<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">From identity to three learned views</title><desc id="desc">Lookup copies a selected row; normalization rescales it; three projections produce distinct activations. E [3,4], token 1 selects x [4]; x̂ᵢ = xᵢwᵢ / √(Σⱼxⱼ²/4 + ε); Q [2,2], K [2,2], V [2,2]; no position yet</desc>
