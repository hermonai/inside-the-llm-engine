<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">One row becomes one output</title><desc id="desc">Match each reduction index, multiply, then accumulate in increasing index order. W [2,3] × x [3] = y [2]; row 0: 1×2 + 2×(-1) + 3×0.5 = 1.5; row 1: 4×2 + 5×(-1) + 6×0.5 = 6</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-GEMV-ROW-001  /  EDUCATIONAL MODEL</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">One row becomes one output</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Match each reduction index, multiply, then accumulate in increasing index order.</text>
<text x="60" y="206" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">01  Select row 0 of W</text>
<rect x="60" y="230" width="72" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">1</text>
<rect x="132" y="230" width="72" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="146" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">2</text>
<rect x="204" y="230" width="72" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="218" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">3</text>
<text x="440" y="206" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">02  Pair the same k</text>
<rect x="440" y="230" width="72" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="454" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">2</text>
<rect x="512" y="230" width="72" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="526" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">-1</text>
<rect x="584" y="230" width="72" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="598" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">0.5</text>
<text x="60" y="327" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">03  Multiply</text>
<rect x="60" y="350" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="379" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">2</text>
<rect x="170" y="350" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="184" y="379" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">-2</text>
<rect x="280" y="350" width="110" height="48" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="294" y="379" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">1.5</text>
<line x1="390" y1="374" x2="477" y2="374" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="477.00,374.00 468.00,378.35 468.00,369.65"/>
<rect x="490" y="339" width="440" height="82" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="504" y="368" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">04  Accumulate in k order</text>
<text x="504" y="393" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">0 + 2 − 2 + 1.5 = 1.5</text>
<rect x="60" y="468" width="870" height="95" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="74" y="497" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">05  Repeat for row 1: 8 − 5 + 3 = 6</text>
<text x="74" y="522" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">y [2] = [1.5, 6] • new owner; W and x remain immutable</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">W [2,3] × x [3] = y [2]</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">row 0: 1×2 + 2×(-1) + 3×0.5 = 1.5</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">row 1: 4×2 + 5×(-1) + 6×0.5 = 6</text>
</svg>
