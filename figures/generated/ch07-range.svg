<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-CH07-RANGE  /  CANONICAL / CHAPTER 7</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Finite input is only the first gate</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Expose square overflow separately from overflow of individually finite squares.</text>
<text x="50" y="211" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="start">F32 arithmetic / alternating [m, -m] / epsilon = 10⁻⁵</text>
