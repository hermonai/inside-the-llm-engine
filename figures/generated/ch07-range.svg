<text x="68" y="555" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="start">Different failure: [10¹⁹,10¹⁹,10¹⁹,10¹⁹] has finite squares but a non-finite sum.</text>
