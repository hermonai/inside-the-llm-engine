<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Rust ownership is part of the tensor contract</title><desc id="desc">The owner contains its buffer. Immutable and exclusive views borrow that buffer and own their metadata.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-TENSOR-OWNERSHIP-001  /  EDUCATIONAL MODEL</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Rust ownership is part of the tensor contract</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">The owner contains its buffer. Immutable and exclusive views borrow that buffer and own</text>
<text x="40" y="163" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">their metadata.</text>
<rect x="40" y="203" width="345" height="150" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="54" y="232" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">«struct» OwnedTensor</text>
<text x="54" y="257" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">shape: Vec&lt;usize&gt;</text>
<text x="54" y="282" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">strides: Vec&lt;usize&gt;</text>
<text x="54" y="307" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">data: Vec&lt;f32&gt;</text>
<rect x="685" y="223" width="265" height="112" fill="#f4ead2" stroke="#152b3c" stroke-width="1.4"/>
<text x="699" y="252" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">«owned buffer»</text>
<text x="699" y="277" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">initialized F32 elements</text>
<text x="699" y="302" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">one Vec allocation</text>
<polygon points="385,275 397,268 409,275 397,282" fill="#152b3c"/>
<line x1="409" y1="275" x2="685" y2="275" stroke="#152b3c" stroke-width="1.5"/>
<text x="447" y="253" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">data owns</text>
<text x="655" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">1</text>
<rect x="40" y="416" width="390" height="145" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="54" y="445" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">«struct» TensorView&lt;&#x27;a&gt;</text>
<text x="54" y="470" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">storage: &amp;&#x27;a [f32]</text>
<text x="54" y="495" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">shape, strides: Vec&lt;usize&gt;</text>
<text x="54" y="520" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">base_offset: usize</text>
<rect x="550" y="416" width="400" height="145" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="564" y="445" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">«struct» TensorViewMut&lt;&#x27;a&gt;</text>
<text x="564" y="470" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">storage: &amp;&#x27;a mut [f32]</text>
<text x="564" y="495" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">shape, strides: Vec&lt;usize&gt;</text>
<text x="564" y="520" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">complete canonical slice</text>
<line x1="390" y1="416" x2="690" y2="335" stroke="#152b3c" stroke-width="2.5" stroke-dasharray="6 5"/>
<polygon fill="#152b3c" points="690.00,335.00 682.44,341.55 680.17,333.15"/>
<text x="428" y="375" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">shared borrow</text>
<line x1="820" y1="416" x2="820" y2="335" stroke="#152b3c" stroke-width="2.5" stroke-dasharray="6 5"/>
<polygon fill="#152b3c" points="820.00,335.00 824.35,344.00 815.65,344.00"/>
<text x="835" y="382" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start">exclusive</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Filled diamond: composition; dashed dependency: borrowed element storage</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Each view owns shape/stride metadata; only TensorView has a base offset</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Shared and exclusive views shown as alternatives; overlapping live access is forbidden</text>
</svg>
