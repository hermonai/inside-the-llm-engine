<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">The active set changes between iterations</title><desc id="desc">A completes while B and C continue. Admission and removal happen at iteration boundaries. P = prompt chunk; D = one decode input; · = absent; Columns are scheduler iterations, not equal time spans; A: P D D ·; B: · P D D; C: · · P D</desc>
