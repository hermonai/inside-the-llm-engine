<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Cache growth preserves the prefix</title><desc id="desc">A single layer stores one K and V row for each processed token; each append extends the valid prefix. L = 1, Hkv = 1, Dₕ = 2, F32; payload(T) = 2 × L × T × Hkv × Dₕ × 4 bytes; T = 1,2,3,4 → 16,32,48,64 bytes</desc>
