<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">One activation, three learned maps</title><desc id="desc">Follow a normalized token through projections into head-major activation storage. Q uses Hq heads; K and V each use Hkv heads. All use width Dh. Model parameters are immutable; projections create F32 activation owners.</desc>
