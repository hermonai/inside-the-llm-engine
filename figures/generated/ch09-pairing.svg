<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Same planes, different channel order</title><desc id="desc">Match adjacent and split-half pairing to an explicit permutation of projected channels. Adjacent pairs (0,1),(2,3); split-half pairs (0,2),(1,3) for R = 4. Permuting both vectors and rotation consistently is equivalent; switching the mode alone is not.</desc>
