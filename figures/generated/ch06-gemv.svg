<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Three rows, three reductions</title><desc id="desc">Apply the same input vector independently to each weight row. W [3,4], x [4], y [3]; reduction dimension K=4. Reference access follows valid element strides, including broadcast strides. Canonical fixture result y=[-3,3,2.5]; x is reused, not transformed into W.</desc>
