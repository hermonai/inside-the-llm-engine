<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">More arithmetic needs organized data</title><desc id="desc">Compare conceptual CPU vectors and cooperative GPU tile execution. SIMD lanes can hold several products; reduction order may change rounding. GPU groups organize loads and reuse; not every product executes at once. CPU/GPU explanation only; ENGINE-2 remains scalar, safe and single-threaded.</desc>
<rect width="1000" height="720" fill="white"/>
<text x="40" y="38" fill="#465c6b" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">FIG-CH06-SIMD-GPU  /  CANONICAL / CHAPTER 6</text>
<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">More arithmetic needs organized data</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Compare conceptual CPU vectors and cooperative GPU tile execution.</text>
<rect x="50" y="205" width="425" height="166" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="64" y="234" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">CPU concept</text>
<text x="64" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">macro tiles → micro tiles</text>
<text x="64" y="284" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">pack if profitable → vector registers</text>
<text x="64" y="309" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">lane products → accumulator vectors</text>
<text x="64" y="334" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">horizontal reduction when required</text>
<text x="64" y="359" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">FMA may round only once</text>
<rect x="520" y="205" width="425" height="166" fill="#dcecf7" stroke="#152b3c" stroke-width="1.4"/>
<text x="534" y="234" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">GPU concept</text>
<text x="534" y="259" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">device/global memory → tiles</text>
<text x="534" y="284" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">threadgroup/block shares work</text>
<text x="534" y="309" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">local/shared storage when used</text>
<text x="534" y="334" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">registers → parallel MAC / matrix ops</text>
<text x="534" y="359" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">barriers order cooperative reuse</text>
<text x="50" y="422" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Four conceptual lanes:</text>
<rect x="50" y="445" width="90" height="44" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="64" y="474" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">2</text>
<rect x="140" y="445" width="90" height="44" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="154" y="474" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">-2</text>
<rect x="230" y="445" width="90" height="44" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="244" y="474" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">-3</text>
<rect x="320" y="445" width="90" height="44" fill="#dcefe7" stroke="#152b3c" stroke-width="1.4"/>
<text x="334" y="474" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">0</text>
<line x1="427" y1="468" x2="506" y2="468" stroke="#152b3c" stroke-width="2.5"/>
<polygon fill="#152b3c" points="506.00,468.00 497.00,472.35 497.00,463.65"/>
<text x="530" y="475" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">reduce lanes → -3</text>
<text x="50" y="554" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">CPU SIMD width and GPU groups differ. Not every multiplication runs simultaneously.</text>
<text x="50" y="583" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Production explanation only: ENGINE-2 adds no intrinsics, threads or accelerator backend.</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="638" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">SIMD lanes can hold several products; reduction order may change rounding.</text>
<text x="40" y="659" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">GPU groups organize loads and reuse; not every product executes at once.</text>
<text x="40" y="680" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">CPU/GPU explanation only; ENGINE-2 remains scalar, safe and single-threaded.</text>
</svg>
