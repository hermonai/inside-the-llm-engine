<text x="40" y="84" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start">Equal tokens do not share mutable activations</text>
<line x1="40" y1="109" x2="960" y2="109" stroke="#152b3c" stroke-width="1.5"/>
<text x="40" y="140" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">Preserve token order and repetition when gathering a sequence into new storage.</text>
<text x="50" y="209" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">IDs [T] = [1, 0, 1]</text>
<text x="515" y="209" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="start">X [T,D] = [3,4] / one owner</text>
