<text x="698" y="267" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">x [4], w [4], epsilon</text>
<text x="698" y="294" fill="#152b3c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">new output y [4]</text>
