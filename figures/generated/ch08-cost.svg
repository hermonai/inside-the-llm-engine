<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Head geometry is a memory decision</title><desc id="desc">Count parameters, arithmetic and future KV payload without inventing speedups. Analytical counting convention: two FLOPs per multiply/add; no bias or output projection. Illustrative KV storage is F16; it is not an implemented cache or measured traffic.</desc>
