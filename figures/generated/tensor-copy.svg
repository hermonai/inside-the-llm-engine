<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Materialization creates a new owner</title><desc id="desc">Visit the transposed view in logical order and copy each value to consecutive destination slots.</desc>
