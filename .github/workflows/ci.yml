name: book-and-engine

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check repository structure
        run: scripts/check-structure.sh
      - name: Check relative Markdown links
        run: python3 scripts/check-links.py
      - name: Check authored textbook, executable request trace and worked calculations
        run: python3 scripts/check-textbook.py
      - name: Check canonical diagram width
        run: python3 scripts/check-diagram-width.py
      - name: Check canonical diagram style and inventory
        run: python3 scripts/check-diagram-style.py
      - name: Check mathematical style structure
        run: python3 scripts/check-math-style.py
      - name: Check deterministic figures and numerical scene contracts
        run: python3 figures/build.py --check
      - name: Check native TikZ figure parity and fail-closed conversion
        run: python3 scripts/check-native-figures.py
      - name: Check industrial curriculum coverage and dependencies
        run: python3 scripts/build-industrial-plan.py --check
      - name: Check industrial visual fixture mutation guards
        run: python3 scripts/check-industrial-visuals.py
      - name: Check Chapter 5 Rust, oracle, and visual parity
        run: python3 scripts/check-tensor-visual-parity.py
      - name: Check Chapter 6 Rust, oracle, and visual parity
        run: python3 scripts/check-linear-visual-parity.py
      - name: Check Chapter 7 Rust, oracle, and visual parity
        run: python3 scripts/check-normalization-visual-parity.py
      - name: Check Chapter 8 Rust, oracle, head geometry and visual parity
        run: python3 scripts/check-qkv-visual-parity.py
      - name: Check Chapter 9 Rust, complex oracle and position geometry
        run: python3 scripts/check-rope-visual-parity.py
      - name: Check Rust formatting
        working-directory: code/mini-engine
        run: cargo fmt --all -- --check
      - name: Check and test mini-engine
        working-directory: code/mini-engine
        run: |
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
